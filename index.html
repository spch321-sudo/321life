:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --sunk:#E7EDE9; --fg:#1C2A24; --muted:#5E6E66; --line:#D3DDD7;
  --vine:#2F6A48; --vine-soft:#DCEBE1; --plum:#86465A; --plum-soft:#F1E1E6; --gold:#A87B1F;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111815; --surface:#18221D; --sunk:#202C26; --fg:#E4ECE7; --muted:#9AAAA1; --line:#2E3C35;
  --vine:#86C49C; --vine-soft:#22382B; --plum:#D492A6; --plum-soft:#3A2630; --gold:#D9AE55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111815; --surface:#18221D; --sunk:#202C26; --fg:#E4ECE7; --muted:#9AAAA1; --line:#2E3C35;
  --vine:#86C49C; --vine-soft:#22382B; --plum:#D492A6; --plum-soft:#3A2630; --gold:#D9AE55; color-scheme:dark}
html,body{background:var(--bg)}
:root{padding-top:env(safe-area-inset-top,0px)}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.7;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.35;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px}
.brand{display:flex;align-items:baseline;gap:10px}
.mark{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;color:var(--vine)}
.brand h1{font-size:20px;font-weight:800}
.eyebrow{font-size:0.75rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
.view{display:grid;gap:16px;padding-block:8px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;min-width:0}
.hero{background:linear-gradient(160deg,var(--vine-soft),var(--surface) 70%);border-color:transparent}
.hero h2{font-size:1.625rem}
.kv{margin:0;border-radius:var(--r);overflow:hidden;background:#1d3a5c;aspect-ratio:1/1;position:relative;box-shadow:0 6px 20px rgba(20,40,30,.18)}
.kv img{display:block;width:100%;height:100%;object-fit:cover}
.kv figcaption{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;color:#fff;font-family:var(--display);font-size:1rem;line-height:1.55;text-align:center;letter-spacing:.04em;background:linear-gradient(to top,rgba(10,20,15,.72),rgba(10,20,15,0));text-shadow:0 1px 3px rgba(0,0,0,.5)}
.kv figcaption span{display:inline-block}
.kv figcaption small{display:block;margin-top:2px;font-family:var(--body);font-size:0.75rem;letter-spacing:.08em;opacity:.92}
@supports not (aspect-ratio:1/1){.kv{height:0;padding-bottom:100%}.kv img{position:absolute;top:0;left:0}}
.verse{font-family:var(--display);font-size:1.0625rem;line-height:1.8;margin:0;padding-left:14px;border-left:3px solid var(--gold)}
.verse cite{display:block;font-family:var(--body);font-style:normal;font-size:0.8125rem;color:var(--muted);margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
.btn.old{background:var(--plum);color:var(--bg)}
.btn.new{background:var(--vine);color:var(--bg)}
.btn.ghost{background:var(--sunk)}
.btn.wide{flex:1 1 140px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:0.75rem;color:var(--muted)}
.week .d{display:grid;gap:4px;justify-items:center}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:0.75rem;font-weight:700}
.dot.done{background:var(--vine);border-color:var(--vine);color:var(--bg)}
.dot.today{border-color:var(--gold)}
.fruit{display:flex;gap:14px;align-items:center}
.fruit .ch{font-family:var(--display);font-size:2.125rem;font-weight:800;color:var(--vine);width:56px;height:56px;border-radius:50%;background:var(--vine-soft);display:grid;place-items:center;flex:none}
.small{font-size:0.875rem;color:var(--muted)}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.pillars div{background:var(--sunk);border-radius:10px;padding:10px 6px;font-size:0.8125rem}
.pillars b{display:block;font-family:var(--display);font-size:0.9375rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:0.9375rem;min-height:38px}
.chip[aria-pressed="true"]{border-color:currentColor;font-weight:700}
.mode-old .chip[aria-pressed="true"]{color:var(--plum);background:var(--plum-soft)}
.mode-new .chip[aria-pressed="true"]{color:var(--vine);background:var(--vine-soft)}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:0.75rem;color:var(--muted);text-align:center}
.legend b{display:block;font-size:1rem;color:var(--fg)}
.group h3{font-size:1.3125rem}
.mode-old .group h3{color:var(--plum)}
.mode-new .group h3{color:var(--vine)}
.item{display:grid;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.item p{margin:0}
.item .sym{font-size:0.8125rem;color:var(--plum)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--sunk);border-radius:10px;min-height:44px;font-weight:700;font-variant-numeric:tabular-nums}
.mode-old .seg button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--bg)}
.mode-new .seg button[aria-pressed="true"]{background:var(--vine);border-color:var(--vine);color:var(--bg)}
.gscore{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.gscore strong{font-size:1.375rem;font-family:var(--display)}
.helps{display:grid;gap:6px;font-size:0.9375rem;background:var(--sunk);border-radius:10px;padding:12px}
.helps p{margin:0}
.helps b{color:var(--muted);font-weight:700;margin-right:6px}
.result{display:grid;gap:10px}
.band{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.band .n{font-family:var(--display);font-size:1.375rem;font-weight:800;min-width:56px;font-variant-numeric:tabular-nums}
ol.steps{margin:0;padding-left:1.4em;display:grid;gap:4px}
.prayer{font-family:var(--display);line-height:1.9;background:var(--sunk);border-radius:10px;padding:14px;margin:0}
.chart{display:grid;gap:10px}
.crow{display:grid;grid-template-columns:44px 1fr 34px;gap:8px;align-items:center;font-size:0.875rem}
.crow .lbl{font-weight:700}
.bars{display:grid;gap:3px}
.track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;border-radius:5px}
.track.o i{background:var(--plum)}
.track.n i{background:var(--vine)}
.nums{font-size:0.75rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.key{display:flex;gap:16px;font-size:0.8125rem;color:var(--muted)}
.key span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.k-old::before{background:var(--plum)}
.k-new::before{background:var(--vine)}
.tnum{font-variant-numeric:tabular-nums}
.split{font-size:0.75rem;letter-spacing:.1em;color:var(--muted);font-weight:700;padding-top:4px}
.rec{display:grid;gap:4px;padding-block:12px;border-top:1px solid var(--line)}
.rec .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{font-size:0.75rem;font-weight:700;border-radius:6px;padding:1px 8px}
.tag.old{background:var(--plum-soft);color:var(--plum)}
.tag.new{background:var(--vine-soft);color:var(--vine)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:0.8125rem;text-decoration:underline;padding:4px}
.linkbtn.danger{color:var(--plum)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg2 button{border:0;background:none;border-radius:9px;min-height:42px;font-weight:700}
.seg2 button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:grid;gap:4px;font-size:0.875rem;font-weight:700;color:var(--muted)}
textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;box-sizing:border-box}
textarea{min-height:72px;resize:vertical}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs button{border:0;background:none;padding:10px 2px 8px;font-size:12px;display:grid;justify-items:center;gap:2px;color:var(--muted);min-height:60px}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--vine);font-weight:700}
nav.tabs button.t-old[aria-current="page"]{color:var(--plum)}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
.hdbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:0.8125rem;color:var(--muted)}
.updbar{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;background:var(--vine);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:608px;margin:0 auto;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.updbar button{border:0;background:var(--bg);color:var(--vine);border-radius:8px;padding:6px 12px;font-weight:700}
[hidden]{display:none!important}
.ckgrp{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.ckgrp h3{font-size:1.125rem;display:flex;align-items:baseline;gap:8px}
.ckgrp h3 em{font-style:normal;font-family:var(--body);font-size:0.8125rem;color:var(--muted);font-weight:500}
.ckno{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--vine-soft);color:var(--vine);font-family:var(--body);font-size:0.8125rem;font-weight:700;flex:none}
.emos{display:flex;flex-wrap:wrap;gap:6px}
.emos .chip{font-size:0.875rem;min-height:34px;padding:4px 12px}
.busy{display:flex;gap:12px;align-items:center}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--vine-soft);border-top-color:var(--vine);flex:none}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.who{justify-self:start;font-size:0.8125rem;font-weight:700;border-radius:999px;padding:2px 12px}
.who.o{background:var(--plum-soft);color:var(--plum)}
.who.m{background:#F4EAD3;color:var(--gold)}
.who.n{background:var(--vine-soft);color:var(--vine)}
:root[data-theme="dark"] .who.m{background:#3A3020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .who.m{background:#3A3020}}
.lk{display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--sunk)}
.lk .mine{font-size:0.875rem;color:var(--muted);margin:0}
.lk .on{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:0.9375rem}
.lk .on dt{font-weight:700}
.lk .on dd{margin:0}
.lk .on .o{color:var(--plum)}
.lk .on .n{color:var(--vine)}
.shift{display:grid;gap:6px}
.shift p{margin:0;padding:10px 12px;border-radius:10px}
.shift .f{background:var(--plum-soft)}
.shift .t{background:var(--vine-soft)}
.act{background:var(--vine);color:var(--bg);border-radius:12px;padding:14px 16px;font-weight:700;font-size:1.0625rem;margin:0}
.ckrec{border:0;background:none;text-align:left;padding:12px 0;border-top:1px solid var(--line);display:grid;gap:2px;width:100%}
.ckrec b{font-size:1rem}
html,body{overflow-x:hidden}
.card{overflow-wrap:anywhere}
.md{display:grid;gap:8px;font-size:1rem;line-height:1.8}
.md p{margin:0}
.md h4{margin:6px 0 0;font-family:var(--display);font-size:1.125rem;color:var(--vine);padding-left:10px;border-left:4px solid var(--vine)}
.md ul,.md ol{margin:0;padding-left:1.4em;display:grid;gap:4px}
.md li::marker{color:var(--vine);font-weight:700}
.md strong{color:var(--fg);background:linear-gradient(transparent 62%,rgba(168,123,31,.25) 0)}
.md blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--gold);background:var(--sunk);border-radius:0 10px 10px 0;font-family:var(--display)}
.md hr{border:0;border-top:1px dashed var(--line);margin:4px 0;width:100%}
.md .next{background:var(--vine-soft);border-radius:10px;padding:10px 12px}
.chat{gap:12px}
.turn{display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.turn .q{justify-self:end;max-width:88%;margin:0;background:var(--vine);color:var(--bg);padding:8px 14px;border-radius:16px 16px 4px 16px;font-weight:500}
.turn .ans{background:var(--surface)}
.chat .chip{text-align:left;line-height:1.5}
html{font-size:16px}
html.fs-lg{font-size:18px}html.fs-xl{font-size:20.5px}html.fs-xxl{font-size:23px}
html[data-lang="zs"]{--display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;--body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}

.flash{outline:3px solid var(--gold);outline-offset:2px}

.sheet-card{background:var(--surface);color:var(--fg);width:100%;max-width:640px;margin:0 auto;max-height:86vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box;display:grid;gap:12px}
.sheet-title{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.125rem}
.sheet-ref{flex:1;font-family:var(--body);font-weight:500;font-size:0.8125rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-x{margin-left:auto;border:0;background:var(--sunk);border-radius:50%;width:32px;height:32px;flex:none}
.sheet-quote{margin:0;font-family:var(--display);line-height:1.8;padding-left:12px;border-left:3px solid var(--gold);max-height:30vh;overflow-y:auto}
.sheet-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sheet-lab{font-size:0.8125rem;color:var(--muted);font-weight:700;min-width:3em}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.hlswatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:0 0 0 1px var(--line)}
.hlswatch.on{border-color:var(--fg)}
.spanrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.spanbtn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;min-width:40px;min-height:38px;font-weight:700}
.spanbtn.wide{padding:0 12px}
.spannum{min-width:3.5em;text-align:center;font-variant-numeric:tabular-nums}
.sheet-ta{min-height:70px}
.sheet-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-acts2{display:flex;flex-wrap:wrap;gap:6px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:0.875rem;background:var(--sunk);font-weight:600}
.btn.danger{color:var(--plum)}
.segx{display:flex;flex-wrap:wrap;gap:6px}
.segx button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 12px;font-size:0.875rem;min-height:36px}
.segx button.on{background:var(--vine);border-color:var(--vine);color:var(--bg);font-weight:700}
.segx.sm button{font-size:0.75rem;min-height:30px;padding:3px 10px}
.setrow{display:grid;gap:6px}
.setrow>span{font-size:0.8125rem;font-weight:700;color:var(--muted)}
.setver{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:0.8125rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.spk{position:fixed;left:12px;right:72px;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;z-index:13;background:var(--fg);color:var(--bg);border-radius:999px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:4px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.spk .t{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spk button{border:0;background:rgba(255,255,255,.14);color:inherit;border-radius:50%;width:36px;height:36px;flex:none;padding:0;font-size:14px}
.seg3{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg3 button{border:0;background:none;border-radius:9px;min-height:42px;font-weight:700;font-size:0.875rem;padding:4px}
.seg3 button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hitem{display:grid;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.hitem .q{font-family:var(--display);line-height:1.8;padding-left:10px;border-left:4px solid #D9B168}
.hitem .q[data-color="green"]{border-color:#6FAE71}.hitem .q[data-color="blue"]{border-color:#6C93D1}.hitem .q[data-color="pink"]{border-color:#E58FA0}.hitem .q[data-color="purple"]{border-color:#A48AC9}.hitem .q[data-color="maroon"]{border-color:#8C4A4E}.hitem .q[data-color="brown"]{border-color:#8A6740}.hitem .q[data-color="charcoal"]{border-color:#54534E}
.hitem .n{font-size:0.875rem;white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:6px 10px}
.hitem .m{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:0.75rem;color:var(--muted);flex-wrap:wrap}
.xz{display:none}
.xz.on{display:flex;flex-direction:column;position:fixed;inset:0;z-index:60;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.xzhd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);max-width:640px;width:100%;margin:0 auto;box-sizing:border-box}
.xzhd .grow{flex:1;min-width:0;line-height:1.3}
.xzhd .hdbtn{flex:none;white-space:nowrap}
.xzav{width:36px;height:36px;border-radius:10px;background:var(--vine);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.xzbd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 20px;max-width:640px;width:100%;margin:0 auto;box-sizing:border-box;display:grid;gap:10px;align-content:start}
.xzft{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);max-width:640px;width:100%;margin:0 auto;box-sizing:border-box}
.xzft textarea{flex:1 1 0;width:0;min-width:0;min-height:46px;max-height:30vh;resize:none}
.xzft .btn{flex:0 0 auto;white-space:nowrap}
.chatctx{justify-self:start;font-size:0.75rem;color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 10px}
.qs-toggle{justify-self:start;border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:0.875rem;color:var(--vine)}
.qs-panel{display:flex;flex-wrap:wrap;gap:6px}
.qs-chip,.fu-chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 12px;font-size:.9em;text-align:left;line-height:1.5}
.chatlog{display:grid;gap:10px}
.xzhi{background:var(--vine-soft);border-radius:14px;padding:12px 14px;line-height:1.8}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;line-height:1.75;overflow-wrap:anywhere}
.msg.user{background:var(--vine);color:var(--bg);margin-left:auto;border-radius:16px 16px 4px 16px;white-space:pre-wrap;max-width:85%}
.msg.ai{background:var(--surface);border:1px solid var(--line);max-width:100%;box-sizing:border-box}
.msg.ai.fold .msg-body{max-height:9.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.msg-more{display:block;margin:6px 0 0;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--sunk);color:var(--vine);font-size:.8em;font-weight:700}
.msg-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.msg-act{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:.82em;color:var(--muted)}
.msg-act.on{color:var(--gold);border-color:var(--gold)}
.fu{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.typing{display:inline-flex;gap:3px;vertical-align:middle}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5}
@media (prefers-reduced-motion:no-preference){.typing i{animation:tp 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes tp{0%,100%{opacity:.25}50%{opacity:1}}}
.tbwrap{overflow-x:auto}
.md .mdtb{border-collapse:collapse;font-size:.93em;min-width:100%}
.md .mdtb th,.md .mdtb td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.md .mdtb th{background:var(--vine-soft)}
.md blockquote{font-size:.97em}
.md em{font-style:normal;color:var(--vine)}
.turn .msg-actions{margin-top:0}
.updbar{cursor:pointer;justify-content:center;font-weight:700;font-size:14px}

</style>
</head>

<script>
var GROUPS=[
 {id:"see",kind:"門戶",name:"看",
  exam:{title:"我的眼睛在看誰？",items:["我很快看見別人的缺點，卻看不見自己的問題","我常拿自己和別人比較，因而自卑或自大","遇到難處時，我先看環境、看人，而不是仰望耶穌","我的眼目被手機、物質或私慾吸引，難以自制","我只看見自己吃虧，看不見神的恩典"],
   newp:"看耶穌、看恩典、看別人的長處。",verse:["為甚麼看見你弟兄眼中有刺，卻不想自己眼中有梁木呢？","馬太福音7:3"]},
  train:{title:"用基督的眼睛看",items:[["我先省察自己的梁木，再溫柔看待別人的刺","只看別人缺點"],["我看見每個人都是神獨特的創造，不與人比較","比較而自卑或自大"],["遇到難處時，我先仰望耶穌，再看環境","先看環境和人"],["我節制眼目，把時間留給神的話和需要我的人","被手機與私慾吸引"],["我天天數算主恩，看見神的手在每件事上","只看自己吃虧"]],
   verse:["求你開我的眼睛，使我看出你律法中的奇妙。","詩篇119:18"],decl:"主啊，我要用你的眼光看人看事。",practice:"每天寫下三件看見的恩典，並當面說出一個人的長處。"}},
 {id:"hear",kind:"門戶",name:"聽",
  exam:{title:"我的耳朵向誰敞開？",items:["別人還沒說完，我已急著回應或打斷","我喜歡聽讚美，聽到勸告就不舒服、想辯解","我愛聽閒話、八卦，並在心裡給人定罪","我聽人的意見多，安靜聽神的話少","我選擇性地聽，只聽自己想聽的"],

  train:{title:"用謙卑的耳朵聽",items:[["我讓人把話說完，聽懂對方的心意再回應","急著回應打斷"],["別人給我勸告時，我說「謝謝你提醒我」","只愛聽讚美"],["聽到閒話時，我停止傳播，並為那人禱告","愛聽八卦論斷人"],["每天我安靜聽神的話，再去聽人的意見","聽人多聽神少"],["我願意聽不同的聲音，從中學習","只聽想聽的"]],

 {id:"think",kind:"門戶",name:"想",

 {id:"speak",kind:"門戶",name:"講",

  openSheet('<div class="sheet-title">'+T("設定")+'<button class="sheet-x" data-sa="close" aria-label="'+T("關閉")+'">✕</button></div>'+
    '<div class="setrow"><span>'+T("語言")+'</span>'+segBtns("lang",[["zh","繁體"],["zs","简体"],["en","English"]],L())+'</div>'+
    '<div class="setrow"><span>'+T("字級")+'</span>'+segBtns("font",[[0,T("標準")],[1,T("大")],[2,T("特大")],[3,T("超大")]],SET.font||0)+'</div>'+
    '<div class="setrow"><span>'+T("主題")+'</span>'+segBtns("theme",[["",T("自動")],["light",T("淺色")],["dark",T("深色")]],SET.theme||"")+'</div>'+
    '<div class="setrow"><span>'+T("朗讀語音")+'</span>'+segBtns("voice",vs,SET.voice||0)+'</div>'+
    '<div class="setrow"><span>'+T("朗讀速度")+'</span>'+segBtns("rate",[[1,T("慢")],[0,T("正常")],[2,T("快")]],SET.rate||0)+'</div>'+
    '<div class="setrow"><span>'+T("真人語音")+'</span>'+segBtns("human",[[1,T("開")],[0,T("關（用手機內建語音）")]],SET.human?1:0)+'</div>'+
    '<div class="setrow"><span>'+T("小智回答對象")+'</span>'+segBtns("aud",audOpts(),SET.aud)+'</div>'+
    '<div class="row" style="margin-top:6px"><button class="btn ghost wide" data-sa="marks">'+T("我的畫線與收藏")+'</button><button class="btn ghost wide" data-sa="backup">'+T("備份與還原")+'</button></div>'+
    '<div class="setver"><span>'+T("版本")+' '+esc(APPVER)+'</span><span><button class="linkbtn" data-sa="chk">'+T("檢查更新")+'</button><button class="linkbtn" data-sa="hard">'+T("強制更新")+'</button></span></div>','setsheet');
}
function setClick(b){
  var n=b.getAttribute("data-set"),v=b.getAttribute("data-v");
  if(n==="lang"){switchLang(v);setTimeout(openSettings,60);return;}
  if(n==="font"){SET.font=+v;saveSet();applyChrome();}
  else if(n==="theme"){SET.theme=v;saveSet();applyChrome();}
  else if(n==="voice"){SET.voice=+v;saveSet();stopAll();speakText(T("平安！我來為你朗讀。"),"try");}
  else if(n==="rate"){SET.rate=+v;saveSet();stopAll();}
  else if(n==="human"){SET.human=v==="1";saveSet();stopAll();}
  else if(n==="aud"){SET.aud=v;saveSet();if(XZ.open)drawXz();}
  toast(T("已更新設定"));openSettings();
}
var AUD_KEYS=["adult", "teen", "kid", "seeker", "elder", "single_parent", "single", "parent", "couple", "pastor"],AUD_ICON={"adult": "🧑", "teen": "🧒", "kid": "🧸", "seeker": "🌱", "elder": "👴", "single_parent": "👩‍👧", "single": "🙋", "parent": "👨‍👩‍👧", "couple": "💑", "pastor": "⛪"},AUD_NM={"zh": {"adult": "成人", "teen": "青少年", "kid": "兒童", "seeker": "慕道友", "elder": "長輩", "single_parent": "單親", "single": "單身", "parent": "父母", "couple": "夫妻", "pastor": "牧者"}, "zs": {"adult": "成人", "teen": "青少年", "kid": "儿童", "seeker": "慕道友", "elder": "长辈", "single_parent": "单亲", "single": "单身", "parent": "父母", "couple": "夫妻", "pastor": "牧者"}, "en": {"adult": "Adult", "teen": "Teen", "kid": "Child", "seeker": "Seeker", "elder": "Elder", "single_parent": "Single parent", "single": "Single", "parent": "Parent", "couple": "Couple", "pastor": "Pastor"}},AUD_SYS6={"zh": {"elder": "\n\n回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "single_parent": "\n\n回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "single": "\n\n回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "parent": "\n\n回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。", "couple": "\n\n回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。", "pastor": "\n\n回答對象：牧者與傳道同工（教會的牧師、傳道人、小組長與事奉的同工）。請站在同工的位置：他們常常肩負許多人的重擔，自己也會疲累、孤單、被誤解或灰心。口吻尊重、平等、真誠，像同工之間彼此扶持，不說教、不居高臨下。可以有適度的深度：點出經文脈絡、原文語境與關鍵字詞的意思，談牧養羊群與生命建造、預備講道與教導、帶領小組與門徒訓練、團隊同心與衝突、面對批評與孤單、屬靈爭戰、自己的靈命與家庭，以及不倦怠的安息與依靠；也可提供講章或查經的切入點、段落與應用建議，但要提醒最後仍須自己在神面前領受。結尾給一個這個星期可以做的具體小步驟（一段安靜親近神的時間、一通關心的電話、一次向同工的坦誠分享）。若提到極度疲憊、憂鬱、想放棄或有自傷念頭，要溫柔回應，並鼓勵立刻尋求信任的同工、屬靈長輩與專業協助。"}, "zs": {"elder": "\n\n回答对象：长辈（约65岁以上）。请用尊敬、温和、慢慢说的口吻，像晚辈敬重地陪长辈读经；句子清楚、不拐弯，不用网路用语和英文缩写；比喻取自一生的阅历（田地、家人、岁月、病痛、孙子、老街坊）。重点先讲，分成短段落，不要太长。肯定他们一生走过的路与在主里的忠心，不说教、不指责、不用「你应该」。可以谈健康与软弱、孤单、放下与交托、把信仰传给下一代、永恒的盼望与感恩。结尾给一件简单、容易做到的小事（一句祷告、打电话问候家人、数算一件感谢）。若提到身体不适、孤单或失去亲人，要先温柔安慰，并鼓励他和家人、教会关怀同工联络。", "single_parent": "\n\n回答对象：单亲爸爸或妈妈（一个人撑起一个家）。请先接住他的辛苦：他常常很累、有愧疚、有孤单，也有经济、时间与教养的压力。口吻温暖、接纳、不评断，不追问过去的原因，不说「你应该再找个伴」，也不把单亲说成缺憾。引用神的心意：神是孤儿的父、寡妇的伸冤者（诗篇68:5），祂与我们同在。再给盼望与实际：每一个小步骤都要在忙碌中做得到（五分钟祷告、跟孩子的一个小仪式、开口向弟兄姐妹求助）。内容简短、段落要短。结尾给一个这个星期做得到的小步骤。若他提到被暴力对待、疲惫到撑不下去或想伤害自己，要温柔回应，并鼓励他立刻联络信任的人、教会同工或专业协助。", "single": "\n\n回答对象：单身的人（可能未婚、离婚、丧偶，或正在等候；不要预设他想结婚或不想结婚）。请不要把单身说成缺憾、「预备期」或「还没到的人生」，也不要用催婚的口气。谈在基督里的身分已经完整、被爱；谈孤单时怎么与神、与朋友、与团契连结；谈时间、金钱与恩赐的运用与使命；谈等待中的信靠；谈感情与婚姻的智慧，以及在情感与身体上的圣洁，态度要尊重、不论断。口吻真诚、平等、轻松。结尾给一个这个星期可以做的小步骤。若他提到孤单到想伤害自己，要温柔回应并鼓励他立刻联络信任的人或专业协助。", "parent": "\n\n回答对象：正在养育孩子的父母（孩子可能从婴幼儿到成年）。请站在父母的位置：他们常常疲累、担心孩子、也常常内疚。口吻温暖、贴近生活、不评断；承认每个孩子与每个家庭都不同。谈陪伴与榜样、管教与恩典的平衡、亲子沟通（怎么听、怎么说）、为孩子祷告、夫妻同心、面对自己的软弱与失败；可用日常场景当比喻（吃饭、功课、手机、睡前）。结尾给一个这个星期可以做的具体小步骤（一句话、一个拥抱、一段睡前祷告）。若提到孩子遭受伤害、家庭暴力或孩子有自伤的念头，要温柔回应并鼓励立刻寻求专业协助与信任的人。", "couple": "\n\n回答对象：夫妻（正在经营婚姻的丈夫与妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侣）。请站在夫妻同行的位置：口吻温暖、真诚、不评断，不偏袒任何一方；承认每段婚姻都有磨合、疲累与受伤的时候。谈爱是决定与付出、彼此饶恕、倾听与表达（怎么说、怎么听）、尊重与同心、金钱与家务的分工、姻亲与孩子的教养、一起祷告与一起读经、在主里成为一体；可用日常场景当比喻（饭桌、手牵手、吵完架之后、睡前）。结尾给一个这个星期两个人就能一起做的具体小步骤（一句感谢的话、一段两人的祷告、一次不看手机的散步）。不要教导妻子顺服或丈夫掌权的单方面要求，要强调彼此相爱、彼此顺服。若提到家庭暴力、外遇、对方的威胁或有自伤念头，要温柔回应，把安全放在第一位，并鼓励立刻寻求专业协助与信任的人，不要劝人一味忍耐。", "pastor": "\n\n回答对象：牧者与传道同工（教会的牧师、传道人、小组长与事奉的同工）。请站在同工的位置：他们常常肩负许多人的重担，自己也会疲累、孤单、被误解或灰心。口吻尊重、平等、真诚，像同工之间彼此扶持，不说教、不居高临下。可以有适度的深度：点出经文脉络、原文语境与关键字词的意思，谈牧养羊群与生命建造、预备讲道与教导、带领小组与门徒训练、团队同心与冲突、面对批评与孤单、属灵争战、自己的灵命与家庭，以及不倦怠的安息与依靠；也可提供讲章或查经的切入点、段落与应用建议，但要提醒最后仍须自己在神面前领受。结尾给一个这个星期可以做的具体小步骤（一段安静亲近神的时间、一通关心的电话、一次向同工的坦诚分享）。若提到极度疲惫、忧郁、想放弃或有自伤念头，要温柔回应，并鼓励立刻寻求信任的同工、属灵长辈与专业协助。"}, "en": {"elder": "\n\nAudience: an elder (about 65 and older). Speak respectfully, gently and unhurriedly, like a younger person reading Scripture with an older one they honour. Short, clear sentences; no internet slang or abbreviations; pictures from a long life (fields, family, the years, illness, grandchildren, old neighbours). Main point first, in short paragraphs. Honour the road they have walked and their faithfulness in the Lord; never preach, scold, or say \"you should\". You may speak of health and frailty, loneliness, letting go and entrusting, passing faith to the next generation, eternal hope and gratitude. End with one simple thing that is easy to do (a short prayer, a phone call to family, counting one blessing). If they mention illness, loneliness or loss, comfort them first and encourage them to reach out to family or the church care team.", "single_parent": "\n\nAudience: a single parent (carrying a household alone). First receive their weariness: they are often exhausted, carry guilt and loneliness, and face pressure over money, time and raising children. Be warm, accepting and non-judging; do not ask why they are single, never say \"you should find a partner\", and never describe single parenting as a lack. Bring in God's heart: he is a father to the fatherless and a defender of widows (Psalm 68:5), and he is with us. Then give hope and practicality — every small step must be doable in a busy life (a five-minute prayer, one small ritual with the child, asking brothers and sisters for help). Keep it short, in short paragraphs. End with one step they can take this week. If they mention being abused, being too exhausted to go on, or wanting to harm themselves, answer gently and encourage them to contact someone they trust, a church worker or professional help right away.", "single": "\n\nAudience: a single person (never married, divorced, widowed, or still waiting — do not assume they want or do not want to marry). Never describe being single as a lack, a \"preparation stage\" or \"life not yet begun\", and never use a pushy-about-marriage tone. Speak of an identity in Christ that is already whole and loved; of connecting with God, friends and fellowship in loneliness; of using time, money and gifts for a purpose; of trusting while waiting; of wisdom in dating and marriage and of purity in heart and body, respectfully and without judging. Be sincere, equal and light. End with one step they can take this week. If they mention loneliness so deep they want to harm themselves, answer gently and encourage them to contact someone they trust or professional help right away.", "parent": "\n\nAudience: a parent raising children (from babies to adult children). Stand in the parent's shoes: they are often tired, worried about their children, and often feel guilty. Be warm, down-to-earth and non-judging; acknowledge that every child and every family is different. Speak of presence and example, balancing discipline and grace, parent–child communication (how to listen, how to speak), praying for children, husband and wife standing together, and facing one's own weakness and failure; use everyday scenes as pictures (mealtime, homework, phones, bedtime). End with one concrete step for this week (one sentence, a hug, a bedtime prayer). If a child is being harmed, there is domestic violence, or the child has thoughts of self-harm, answer gently and encourage seeking professional help and a trusted person right away.", "couple": "\n\nAudience: a married couple (husband and wife — newlyweds, parents in the thick of life, or long-time partners). Stand beside them as a fellow traveler: warm, sincere, never judging and never taking one side; admit every marriage has seasons of friction, weariness and hurt. Speak of love as a decision and a gift, forgiving one another, listening and speaking well, respect and unity, money and household work, in-laws and raising children, praying and reading Scripture together, becoming one in the Lord. Use everyday pictures (the dinner table, holding hands, after an argument, bedtime). Close with one small step the two of them can do together this week (a word of thanks, a short prayer together, a phone-free walk). Never lay one-sided demands on the wife to submit or the husband to rule; stress mutual love and mutual submission. If domestic violence, an affair, threats or thoughts of self-harm come up, respond gently, put safety first, and encourage reaching out at once to professionals and trusted people — never urge someone just to endure.", "pastor": "\n\nAudience: a pastor or ministry worker (pastor, preacher, small-group leader, church staff or volunteer). Stand beside them as a fellow worker: they carry many people's burdens and can themselves be weary, lonely, misunderstood or discouraged. Be respectful, equal and sincere — never lecturing or talking down. You may go deeper: the context of the passage, the sense of key words, shepherding and building lives, sermon and lesson preparation, leading groups and discipleship, team unity and conflict, criticism and loneliness, spiritual warfare, one's own walk and family, and resting in God without burning out. You may offer a sermon or Bible-study outline with points and applications, but remind them to receive the word from God themselves first. Close with one small step for this week (a quiet hour with God, a caring phone call, an honest talk with a coworker). If extreme exhaustion, depression, wanting to quit or self-harm come up, respond gently and encourage reaching out at once to trusted coworkers, spiritual elders and professionals."}};
function audName(k){var n=(AUD_NM[L()]||AUD_NM.zh)[k]||k;return AUD_ICON[k]+" "+n;}
function audOpts(){var o=[];eachA(AUD_KEYS,function(k){o.push([k,audName(k)]);});return o;}
function audLine(){
  var a=SET.aud||"adult";if(a==="adult"||AUD_KEYS.indexOf(a)<0)return "";
  if(AUD_SYS6.zh[a])return (AUD_SYS6[L()]||AUD_SYS6.zh)[a];
  if(isEN())return {teen:"\n\n[AUDIENCE: TEENAGER] Talk like a friend: humorous and light, a little playful, never preachy or flippant, never joke about God or the Bible. Keep it short.",
    kid:"\n\n[AUDIENCE: CHILD 5-11] Very simple words, short sentences, like telling a story; one idea per sentence; no hard terms.",

function isBusy(){return !!(spk.on||sayKey||chatBusy||ck.busy||ck.asking||hlOpen()||(document.activeElement&&/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)));}
var UPD = { reg: null, target: '', pending: false };
function ssGet(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }
function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { } }
function verFetch(ok, fail) {
  var x = new XMLHttpRequest();
  x.open('GET', 'version.json?t=' + now(), true);
  try { x.setRequestHeader('Cache-Control', 'no-cache'); } catch (e) { }
  x.timeout = 15000;
  x.onload = function () { if (x.status >= 200 && x.status < 300) { try { return ok(JSON.parse(x.responseText)); } catch (e) { } } if (fail) fail(); };
  x.onerror = x.ontimeout = function () { if (fail) fail(); };
  x.send();
}
function updBar(on) {
  var b = $("updbar");
  if (!on) { if (b) b.parentNode.removeChild(b); return; }
  if (!b) { b = document.createElement('div'); b.id = 'updbar'; b.className = 'updbar'; b.onclick = function () { applyUpdate(false); }; document.body.appendChild(b); }
  b.textContent = T("已有新版本，點這裡立即更新");
}
function reloadFresh() { if (window.__reloading) return; window.__reloading = 1; location.replace(location.pathname + '?u=' + now() + location.hash); }
function applyUpdate(hard) {
  updBar(false); toast(T("正在更新到新版本……"));
  ssSet('updTry', UPD.target || 'x');
  if (!hard && navigator.serviceWorker && UPD.reg) {
    try { if (UPD.reg.waiting) UPD.reg.waiting.postMessage('skip'); UPD.reg.update(); } catch (e) { }
    setTimeout(reloadFresh, 900); return;
  }
  ssSet('updHard', UPD.target || 'x');
  var done = 0, fin = function () { if (!done) { done = 1; reloadFresh(); } };
  try {
    if (window.caches && caches.keys) caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches['delete'](k); })); })['catch'](function () { });
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) navigator.serviceWorker.getRegistrations().then(function (rs) { for (var i = 0; i < rs.length; i++) rs[i].unregister(); setTimeout(fin, 300); }, fin);
  } catch (e) { }
  setTimeout(fin, 1500);
}
function onNewVersion(v) {
  if (!v || v === APPVER) return;
  UPD.target = v;
  if (isBusy()) { UPD.pending = true; updBar(true); return; }
  if (ssGet('updHard') === v) { updBar(true); return; }
  applyUpdate(ssGet('updTry') === v);
}
function updIdle() {
  if (UPD.pending && isBusy()) { if (!UPD.t) UPD.t = setTimeout(function () { UPD.t = 0; updIdle(); }, 20000); return; } if (UPD.pending && !isBusy()) { UPD.pending = false; onNewVersion(UPD.target); } }
function checkUpdate(manual) {
  if (navigator.onLine === false) { if (manual) toast(T("網路連不上，請稍後再試")); return; }
  try { if (UPD.reg) UPD.reg.update(); } catch (e) { }
  verFetch(function (j) {
    if (j && j.v && j.v !== APPVER) onNewVersion(j.v);
    else if (manual) toast(T("已是最新版本"));
  }, function () { if (manual) toast(T("網路連不上，請稍後再試")); });
}
function initUpdate() {
  if (!/^https?:/.test(location.protocol)) return;
  if (/[?&]u=\d+/.test(location.search) && history.replaceState) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { } }
  if ('serviceWorker' in navigator) {
    var sw = navigator.serviceWorker;
    sw.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      UPD.reg = reg;
      var track = function (w) { if (w) w.addEventListener('statechange', function () { if (w.state === 'installed' && sw.controller) checkUpdate(0); }); };
      track(reg.installing); track(reg.waiting);
      reg.addEventListener('updatefound', function () { track(reg.installing); });
    })['catch'](function () { });
    sw.addEventListener('message', function (e) { var d = e.data || {}; if (d.t === 'sw-updated' && d.v && d.v !== APPVER) onNewVersion(d.v); });
    sw.addEventListener('controllerchange', function () { if (UPD.target && !isBusy()) reloadFresh(); });
  }
  setTimeout(function () { checkUpdate(0); }, 2500);
  setInterval(function () { checkUpdate(0); }, 30 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') checkUpdate(0); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) checkUpdate(0); });
  window.addEventListener('online', function () { checkUpdate(0); });
}
