<style>
/* Layout: one-column phone app, header + content + fixed bottom tab bar. Vine green = new self, muted plum = old self. */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --sunk:#E7EDE9; --fg:#1C2A24; --muted:#5E6E66; --line:#D3DDD7;
  --vine:#2F6A48; --vine-soft:#DCEBE1; --plum:#86465A; --plum-soft:#F1E1E6; --gold:#A87B1F;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111815; --surface:#18221D; --sunk:#202C26; --fg:#E4ECE7; --muted:#9AAAA1; --line:#2E3C35;
  --vine:#86C49C; --vine-soft:#22382B; --plum:#D492A6; --plum-soft:#3A2630; --gold:#D9AE55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111815; --surface:#18221D; --sunk:#202C26; --fg:#E4ECE7; --muted:#9AAAA1; --line:#2E3C35;
  --vine:#86C49C; --vine-soft:#22382B; --plum:#D492A6; --plum-soft:#3A2630; --gold:#D9AE55; color-scheme:dark}
html,body{background:var(--bg)}
:root{padding-top:env(safe-area-inset-top,0px)}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.35;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px}
.brand{display:flex;align-items:baseline;gap:10px}
.mark{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;color:var(--vine)}
.brand h1{font-size:20px;font-weight:800}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.view{display:grid;gap:16px;padding-block:8px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;min-width:0}
.hero{background:linear-gradient(160deg,var(--vine-soft),var(--surface) 70%);border-color:transparent}
.hero h2{font-size:26px}
.kv{margin:0;border-radius:var(--r);overflow:hidden;background:#1d3a5c;aspect-ratio:1/1;position:relative;box-shadow:0 6px 20px rgba(20,40,30,.18)}
.kv img{display:block;width:100%;height:100%;object-fit:cover}
.kv figcaption{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;color:#fff;font-family:var(--display);font-size:16px;line-height:1.55;text-align:center;letter-spacing:.04em;background:linear-gradient(to top,rgba(10,20,15,.72),rgba(10,20,15,0));text-shadow:0 1px 3px rgba(0,0,0,.5)}
.kv figcaption span{display:inline-block}
.kv figcaption small{display:block;margin-top:2px;font-family:var(--body);font-size:12px;letter-spacing:.08em;opacity:.92}
@supports not (aspect-ratio:1/1){.kv{height:0;padding-bottom:100%}.kv img{position:absolute;top:0;left:0}}
.verse{font-family:var(--display);font-size:17px;line-height:1.8;margin:0;padding-left:14px;border-left:3px solid var(--gold)}
.verse cite{display:block;font-family:var(--body);font-style:normal;font-size:13px;color:var(--muted);margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
.btn.old{background:var(--plum);color:var(--bg)}
.btn.new{background:var(--vine);color:var(--bg)}
.btn.ghost{background:var(--sunk)}
.btn.wide{flex:1 1 140px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.week .d{display:grid;gap:4px;justify-items:center}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.dot.done{background:var(--vine);border-color:var(--vine);color:var(--bg)}
.dot.today{border-color:var(--gold)}
.fruit{display:flex;gap:14px;align-items:center}
.fruit .ch{font-family:var(--display);font-size:34px;font-weight:800;color:var(--vine);width:56px;height:56px;border-radius:50%;background:var(--vine-soft);display:grid;place-items:center;flex:none}
.small{font-size:14px;color:var(--muted)}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.pillars div{background:var(--sunk);border-radius:10px;padding:10px 6px;font-size:13px}
.pillars b{display:block;font-family:var(--display);font-size:15px}
/* group picker */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px;min-height:38px}
.chip[aria-pressed="true"]{border-color:currentColor;font-weight:700}
.mode-old .chip[aria-pressed="true"]{color:var(--plum);background:var(--plum-soft)}
.mode-new .chip[aria-pressed="true"]{color:var(--vine);background:var(--vine-soft)}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;color:var(--muted);text-align:center}
.legend b{display:block;font-size:16px;color:var(--fg)}
.group h3{font-size:21px}
.mode-old .group h3{color:var(--plum)}
.mode-new .group h3{color:var(--vine)}
.item{display:grid;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.item p{margin:0}
.item .sym{font-size:13px;color:var(--plum)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--sunk);border-radius:10px;min-height:44px;font-weight:700;font-variant-numeric:tabular-nums}
.mode-old .seg button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--bg)}
.mode-new .seg button[aria-pressed="true"]{background:var(--vine);border-color:var(--vine);color:var(--bg)}
.gscore{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.gscore strong{font-size:22px;font-family:var(--display)}
.helps{display:grid;gap:6px;font-size:15px;background:var(--sunk);border-radius:10px;padding:12px}
.helps p{margin:0}
.helps b{color:var(--muted);font-weight:700;margin-right:6px}
.result{display:grid;gap:10px}
.band{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.band .n{font-family:var(--display);font-size:22px;font-weight:800;min-width:56px;font-variant-numeric:tabular-nums}
ol.steps{margin:0;padding-left:1.4em;display:grid;gap:4px}
.prayer{font-family:var(--display);line-height:1.9;background:var(--sunk);border-radius:10px;padding:14px;margin:0}
/* growth chart */
.chart{display:grid;gap:10px}
.crow{display:grid;grid-template-columns:44px 1fr 34px;gap:8px;align-items:center;font-size:14px}
.crow .lbl{font-weight:700}
.bars{display:grid;gap:3px}
.track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;border-radius:5px}
.track.o i{background:var(--plum)}
.track.n i{background:var(--vine)}
.nums{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.key{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.key span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.k-old::before{background:var(--plum)}
.k-new::before{background:var(--vine)}
.tnum{font-variant-numeric:tabular-nums}
.split{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700;padding-top:4px}
.rec{display:grid;gap:4px;padding-block:12px;border-top:1px solid var(--line)}
.rec .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.tag.old{background:var(--plum-soft);color:var(--plum)}
.tag.new{background:var(--vine-soft);color:var(--vine)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
.linkbtn.danger{color:var(--plum)}
/* journal */
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg2 button{border:0;background:none;border-radius:9px;min-height:42px;font-weight:700}
.seg2 button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:grid;gap:4px;font-size:14px;font-weight:700;color:var(--muted)}
textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;box-sizing:border-box}
textarea{min-height:72px;resize:vertical}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs button{border:0;background:none;padding:10px 2px 8px;font-size:12px;display:grid;justify-items:center;gap:2px;color:var(--muted);min-height:60px}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--vine);font-weight:700}
nav.tabs button.t-old[aria-current="page"]{color:var(--plum)}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
.hdbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.updbar{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;background:var(--vine);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:608px;margin:0 auto;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.updbar button{border:0;background:var(--bg);color:var(--vine);border-radius:8px;padding:6px 12px;font-weight:700}
[hidden]{display:none!important}
/* 生命健檢 */
.ckgrp{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.ckgrp h3{font-size:18px;display:flex;align-items:baseline;gap:8px}
.ckgrp h3 em{font-style:normal;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.ckno{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--vine-soft);color:var(--vine);font-family:var(--body);font-size:13px;font-weight:700;flex:none}
.emos{display:flex;flex-wrap:wrap;gap:6px}
.emos .chip{font-size:14px;min-height:34px;padding:4px 12px}
.busy{display:flex;gap:12px;align-items:center}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--vine-soft);border-top-color:var(--vine);flex:none}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.who{justify-self:start;font-size:13px;font-weight:700;border-radius:999px;padding:2px 12px}
.who.o{background:var(--plum-soft);color:var(--plum)}
.who.m{background:#F4EAD3;color:var(--gold)}
.who.n{background:var(--vine-soft);color:var(--vine)}
:root[data-theme="dark"] .who.m{background:#3A3020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .who.m{background:#3A3020}}
.lk{display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--sunk)}
.lk .mine{font-size:14px;color:var(--muted);margin:0}
.lk .on{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:15px}
.lk .on dt{font-weight:700}
.lk .on dd{margin:0}
.lk .on .o{color:var(--plum)}
.lk .on .n{color:var(--vine)}
.shift{display:grid;gap:6px}
.shift p{margin:0;padding:10px 12px;border-radius:10px}
.shift .f{background:var(--plum-soft)}
.shift .t{background:var(--vine-soft)}
.act{background:var(--vine);color:var(--bg);border-radius:12px;padding:14px 16px;font-weight:700;font-size:17px;margin:0}
.ckrec{border:0;background:none;text-align:left;padding:12px 0;border-top:1px solid var(--line);display:grid;gap:2px;width:100%}
.ckrec b{font-size:16px}
.raw p{margin:0 0 8px}
</style>
</head>

<script>
/* 321生命操練 v1.2.0 — ES5 */

var GROUPS=[
 {id:"see",kind:"門戶",name:"看",
  exam:{title:"我的眼睛在看誰？",items:["我很快看見別人的缺點，卻看不見自己的問題","我常拿自己和別人比較，因而自卑或自大","遇到難處時，我先看環境、看人，而不是仰望耶穌","我的眼目被手機、物質或私慾吸引，難以自制","我只看見自己吃虧，看不見神的恩典"],
   newp:"看耶穌、看恩典、看別人的長處。",verse:["為甚麼看見你弟兄眼中有刺，卻不想自己眼中有梁木呢？","馬太福音7:3"]},
  train:{title:"用基督的眼睛看",items:[["我先省察自己的梁木，再溫柔看待別人的刺","只看別人缺點"],["我看見每個人都是神獨特的創造，不與人比較","比較而自卑或自大"],["遇到難處時，我先仰望耶穌，再看環境","先看環境和人"],["我節制眼目，把時間留給神的話和需要我的人","被手機與私慾吸引"],["我天天數算主恩，看見神的手在每件事上","只看自己吃虧"]],
   verse:["求你開我的眼睛，使我看出你律法中的奇妙。","詩篇119:18"],decl:"主啊，我要用你的眼光看人看事。",practice:"每天寫下三件看見的恩典，並當面說出一個人的長處。"}},
 {id:"hear",kind:"門戶",name:"聽",
  exam:{title:"我的耳朵向誰敞開？",items:["別人還沒說完，我已急著回應或打斷","我喜歡聽讚美，聽到勸告就不舒服、想辯解","我愛聽閒話、八卦，並在心裡給人定罪","我聽人的意見多，安靜聽神的話少","我選擇性地聽，只聽自己想聽的"],
   newp:"先聽神，再聽人；聽懂心意，不只聽字面。",verse:["你們各人要快快的聽，慢慢的說，慢慢的動怒。","雅各書1:19"]},
  train:{title:"用謙卑的耳朵聽",items:[["我讓人把話說完，聽懂對方的心意再回應","急著回應打斷"],["別人給我勸告時，我說「謝謝你提醒我」","只愛聽讚美"],["聽到閒話時，我停止傳播，並為那人禱告","愛聽八卦論斷人"],["每天我安靜聽神的話，再去聽人的意見","聽人多聽神少"],["我願意聽不同的聲音，從中學習","只聽想聽的"]],
   verse:["我的羊聽我的聲音，我也認識他們，他們也跟著我。","約翰福音10:27"],decl:"請說，僕人敬聽！",practice:"每次對話先問「你的意思是……嗎？」確認之後再回應。"}},
 {id:"think",kind:"門戶",name:"想",
  exam:{title:"我的心思由誰掌管？",items:["我的念頭常繞著「我」：我的面子、我的感受、我的得失","我常憂慮未來，或反覆咀嚼過去的傷害","我在心裡論斷人、猜疑人的動機","做決定時我用腦算計，很少用心尋求聖靈","負面的想法一來，我就順著它走"],

function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}

function sum(a){var t=0;for(var i=0;i<a.length;i++){t+=a[i]||0;}return t;}
function has(arr,x){return arr.indexOf(x)>-1;}
function pad2(n){return n<10?"0"+n:""+n;}
function dkey(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function fmtDate(k){var p=k.split("-");return (+p[1])+"月"+(+p[2])+"日";}
function band(mode,n){var b=BANDS[mode];for(var i=0;i<b.length;i++){if(n<=b[i][0])return b[i];}return b[b.length-1];}
function answeredCount(a){var c=0;for(var i=0;i<a.length;i++){if(a[i]!=null)c++;}return c;}

function latest(kind,id){

}
function delControls(id){

    ?'<span><button class="linkbtn danger" data-del="'+id+'">確定刪除</button><button class="linkbtn" data-cancel="1">取消</button></span>'
    :'<button class="linkbtn" data-ask="'+id+'">刪除</button>';

function chartRows(from,to){

    out+='<div class="crow"><span class="lbl">'+g.name+'</span><div class="bars">'+

function ckPrompt(inp){

}
function ckParse(t){
  var a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a>-1&&b>a){try{var o=JSON.parse(t.slice(a,b+1));if(o&&o.title)return o;}catch(e){}}
  return {raw:t};
}
function ckAsk(inp,done){
  var x;try{x=new XMLHttpRequest();}catch(e){done("這個瀏覽器無法連線");return;}
  var fin=false;function end(err,txt){if(fin)return;fin=true;done(err,txt);}
  x.open("POST",XI_ENDPOINT,true);
  x.setRequestHeader("Content-Type","application/json");
  x.timeout=90000;
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    if(x.status<200||x.status>=300){end("小智暫時連不上（"+(x.status||"網路")+"），草稿已保留，請稍後再按一次。");return;}
    try{var d=JSON.parse(x.responseText),t="",c=d.content||[];
      for(var i=0;i<c.length;i++){if(c[i].type==="text")t+=c[i].text;}
      if(!t)throw 0;end(null,t);
    }catch(e){end("小智的回覆讀不出來，請再按一次。");}
  };
  x.ontimeout=function(){end("等太久沒有回應，草稿已保留，請再按一次。");};
  x.onerror=function(){end("網路連不上小智，草稿已保留，連上網路後再按一次。");};
  x.send(JSON.stringify({model:XI_MODEL,max_tokens:2500,system:CK_SYS,messages:[{role:"user",content:ckPrompt(inp)}]}));
}
function ckRun(inp,oldId){

  ckAsk(inp,function(err,txt){
    ck.busy=false;
    if(err){ck.err=err;if(oldId)ck.show=oldId;if(state.tab==="check")keepScroll();toast(err.split("，")[0]);return;}
    var now=new Date().getTime(),rec={id:oldId||("check-"+now),kind:"check",date:TODAY,ts:now,input:inp,ai:ckParse(txt)};
    if(oldId){for(var i=0;i<entries.length;i++){if(entries[i].id===oldId){rec.date=entries[i].date;rec.ts=entries[i].ts;}}}
    if(!putEntry(rec)){toast("儲存失敗：瀏覽器不允許儲存資料，請關閉無痕模式後再試");}

function exportBackup(){
  var data=JSON.stringify({app:"321生命操練",version:1,exported:new Date().toISOString(),entries:entries},null,1);
  try{
    var blob=new Blob([data],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="321生命操練備份-"+TODAY+".json";document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    toast("已匯出備份檔");
  }catch(e){toast("這個瀏覽器無法下載檔案，請改用 Safari 或 Chrome 開啟");}
}
function importBackup(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var obj=JSON.parse(rd.result),list=obj&&obj.entries;
      if(!list||typeof list.length!=="number")throw 0;
      var seen={},i,added=0;
      for(i=0;i<entries.length;i++)seen[entries[i].id]=1;
      for(i=0;i<list.length;i++){if(list[i]&&list[i].id&&!seen[list[i].id]){entries.push(list[i]);seen[list[i].id]=1;added++;}}
      saveAll();render();toast("已匯入 "+added+" 筆記錄");
    }catch(e){toast("這不是 321生命操練的備份檔，請重新選擇");}
  };
  rd.readAsText(file);
}

  }

    for(i=0;i<S.sel.length;i++){var aa=S.ans[S.sel[i]]||[];if(answeredCount(aa)===5){scores[S.sel[i]]=aa.slice();any=true;}}

  }

  if(b.id==="j-save"){
    var j=saveJournalDraft();
    if(!j.a.replace(/\s/g,"")&&!j.b.replace(/\s/g,"")&&!j.d.replace(/\s/g,"")){toast("請至少寫下一欄內容");return;}
    var trim=function(s){return s.replace(/^\s+|\s+$/g,"");};
    var r={id:j.mode+"-"+new Date().getTime(),kind:j.mode,date:TODAY,ts:new Date().getTime(),area:j.area,a:trim(j.a),b:trim(j.b),c:trim(j.c),d:trim(j.d),fruits:j.fruits};
    if(!putEntry(r)){toast("儲存失敗：瀏覽器不允許儲存資料，請關閉無痕模式後再試");return;}
    jdraft=null;render();toast("已儲存，榮耀歸給耶穌");
  }
});
render();

/* ---------- 離線與自動更新 ---------- */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.addEventListener("updatefound",function(){
        var nw=reg.installing;if(!nw)return;
        nw.addEventListener("statechange",function(){
          if(nw.state==="installed"&&navigator.serviceWorker.controller){$("updbar").hidden=false;}
        });
      });
    })["catch"](function(){});
    var reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",function(){if(reloaded)return;reloaded=true;location.reload();});
  });
  $("updbtn").addEventListener("click",function(){
    navigator.serviceWorker.getRegistration().then(function(reg){
      if(reg&&reg.waiting)reg.waiting.postMessage("skip");else location.reload();
    });
  });
}
</script>
</body>
