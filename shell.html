    '#k3mSheet .k3m-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}' +
    '#k3mSheet .k3m-big{margin:0 0 6px;font-size:1.35em;line-height:1.4}' +
    '.k3m-box{background:var(--card,#fff);border:1px solid var(--line,#ddd8cc);border-radius:16px;padding:14px 16px;margin:12px 0}' +
    '.k3m-muted{color:var(--dusk,#6b7770);font-size:.9em;margin:10px 0 0}' +
    '.k3m-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line,#ddd8cc)}.k3m-row:last-child{border-bottom:none}' +
    '.k3m-row .k3m-btn.sm{margin-top:0}' +
    '.k3m-time{flex:0 0 auto;min-width:96px;background:var(--paper,#f3f1ec);border-radius:12px;padding:6px 10px;text-align:center;font-size:.88em;line-height:1.5}.k3m-time b,.k3m-time small{display:block}.k3m-time small{color:var(--dusk,#6b7770);font-size:.82em}' +
    '.k3m-mid{flex:1;min-width:0}.k3m-mid .t{font-weight:700}.k3m-mid .s{font-size:.82em;color:var(--dusk,#6b7770)}.k3m-mid .cd{font-size:.82em;color:#1F4D3D;font-weight:700}' +
    '.k3m-offer{border:1px solid var(--line,#ddd8cc);border-radius:12px;padding:12px 14px;margin-top:10px}' +
    '.k3m-offer .oc{display:inline-block;background:#1F4D3D;color:#fff;border-radius:8px;padding:2px 10px;font-size:.8em;font-weight:700}' +
    '.k3m-offer .oh{font-weight:700;margin:8px 0 2px;overflow-wrap:anywhere}.k3m-offer .od{color:var(--dusk,#6b7770);font-size:.9em}' +
    '.k3m-offer .oa{font-family:ui-monospace,Menlo,monospace;font-size:1.02em;margin:6px 0 4px;overflow-wrap:anywhere}' +
    '#k3mToast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,28,24,.92);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:2147483001;pointer-events:none}';
  function css() {
    if (document.getElementById('k3mcss')) return;
    var s = document.createElement('style'); s.id = 'k3mcss'; s.textContent = CSS;
    (document.head || document.documentElement).appendChild(s);
  }
  function toast(t) {
    var el = document.getElementById('k3mToast');
    if (!el) { el = document.createElement('div'); el.id = 'k3mToast'; document.body.appendChild(el); }
    el.textContent = t; el.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(function () { el.style.display = 'none'; }, 1800);
  }
  function copy(i) {
    var a = OFFERING[i].acct, ok = L('已複製帳號', '已复制账号', 'Account number copied');
    function fb() {
      var ta = document.createElement('textarea'); ta.value = a; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast(ok); } catch (e) { toast(a); }
      document.body.removeChild(ta);
    }
    try { navigator.clipboard.writeText(a).then(function () { toast(ok); }, fb); } catch (e) { fb(); }
  }
  function open() {
    css();
    var el = document.getElementById('k3mSheet');
    if (!el) { el = document.createElement('div'); el.id = 'k3mSheet'; document.body.appendChild(el); }
    el.innerHTML = '<div class="k3m-mask" onclick="K321MEET.close()"></div><div class="k3m-panel">' + sheet() + '</div>';
    el.className = 'on';
    try { document.documentElement.style.overflow = 'hidden'; } catch (e) {}
  }
  function close() {
    var el = document.getElementById('k3mSheet'); if (el) el.className = '';
    try { document.documentElement.style.overflow = ''; } catch (e) {}
  }
  function tick() {
    var slots = document.querySelectorAll('.k3m-slot');
    if (!slots.length) return;
    var h = nextCard();
    for (var i = 0; i < slots.length; i++) slots[i].innerHTML = h;
  }

  /* ── 掛到首頁 ── */
  function place() {
    var hook = CFG.hook;
    if (!hook || !hook.sel) return;
    var host = document.querySelector(hook.sel);
    if (!host) return;
    if (host.querySelector('[data-k3m]')) return;
    if (hook.need && !hook.need(host)) return;
    var tmp = document.createElement('div'); tmp.innerHTML = card();
    var node = tmp.firstChild;
    var ref = hook.before ? host.querySelector(hook.before) : null;
    if (ref && ref.parentNode) ref.parentNode.insertBefore(node, ref);
    else if (hook.where === 'start') host.insertBefore(node, host.firstChild);
    else if (hook.after && host.querySelector(hook.after)) { var a = host.querySelector(hook.after); a.parentNode.insertBefore(node, a.nextSibling); }
    else host.appendChild(node);
  }
  var pend = 0;
  function watch() {
    if (!CFG.hook || !CFG.hook.sel) return;
    place();
    try {
      new MutationObserver(function () {
        if (pend) return;
        pend = setTimeout(function () { pend = 0; place(); }, 60);
      }).observe(document.body, { childList: true, subtree: true });
    } catch (e) {}
  }
  function wrapFn(name, marker) {
    var orig = window[name];
    if (typeof orig !== 'function' || orig.__k3m) return false;
    var w = function () {
      var h = orig.apply(this, arguments);
      if (typeof h !== 'string' || h.indexOf('data-k3m') >= 0) return h;
      var cut = marker ? h.lastIndexOf(marker) : -1;
      return cut > 0 ? h.slice(0, cut) + card() + h.slice(cut) : h + card();
    };
    w.__k3m = 1;
    window[name] = w;
    return true;
  }

  window.K321MEET = { open: open, close: close, copy: copy, card: card, nextCard: nextCard, place: place, tick: tick };
  css();
  function boot() {
    css();
    if (CFG.wrap) {
      if (wrapFn(CFG.wrap, CFG.marker || '') && CFG.rerender) { try { CFG.rerender(); } catch (e) {} }
    }
    watch();
    setInterval(tick, 30000);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
